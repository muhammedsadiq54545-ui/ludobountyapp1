name: Build Android Release AAB & APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable & ensure wrapper jar exists
        run: |
          cd android
          chmod +x gradlew
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            mkdir -p gradle/wrapper
            curl -sSL "https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar
          fi

      - name: Generate Release Keystore
        run: |
          cd android/app
          if [ ! -f release.keystore ]; then
            keytool -genkey -v -keystore release.keystore -alias ludobounty -keyalg RSA -keysize 2048 -validity 10000 -storepass ludobounty123 -keypass ludobounty123 -dname "CN=LudoBounty, OU=Gaming, O=LudoBounty, L=SanFrancisco, S=California, C=US"
            echo "Release keystore generated."
          fi

      - name: Build Android App Bundle (AAB for Google Play Console)
        run: |
          cd android
          ./gradlew bundleRelease --stacktrace

      - name: Build APKs (for Direct Device Testing)
        run: |
          cd android
          ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Upload AAB Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ludo-bounty-release-aab
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ludo-bounty-apks
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
